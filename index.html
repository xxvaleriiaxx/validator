<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальный валидатор форм</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
    <h1>🧪 Универсальный валидатор форм</h1>
    <div class="panels">
        <div class="panel">
            <h2>📋 Демо-форма</h2>
            <div class="form-group">
                <label>Email <span class="badge">проверка домена</span></label>
                <input type="text" id="email" placeholder="test@example.com">
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label>Телефон <span class="badge">маска +7 (###) ###-####</span></label>
                <input type="text" id="phone" placeholder="+7 (912) 345-6789">
                <div class="error-message" id="phoneError"></div>
                <div class="mask-preview" id="phoneMaskPreview"></div>
            </div>
            <div class="form-group">
                <label>Пароль <span class="badge">сила: слабый / хороший / надёжный</span></label>
                <input type="text" id="password" placeholder="Введите пароль">
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>
            <div class="form-group">
                <label>Подтверждение пароля</label>
                <input type="text" id="confirmPassword" placeholder="повторите пароль">
                <div class="error-message" id="confirmError"></div>
            </div>
            <div class="form-group">
                <label>URL <span class="badge">http/https/ftp</span></label>
                <input type="text" id="url" placeholder="https://example.com">
                <div class="error-message" id="urlError"></div>
            </div>
            <div class="form-group">
                <label>Дата <span class="badge">ДД.ММ.ГГГГ / ГГГГ-ММ-ДД</span></label>
                <input type="text" id="date" placeholder="31.12.2025">
                <div class="error-message" id="dateError"></div>
            </div>
            <div class="form-group">
                <label>Файл (изображение, ≤2МБ)</label>
                <input type="file" id="file" accept="image/*">
                <div class="error-message" id="fileError"></div>
            </div>
            <div class="button-row">
                <button class="primary" id="validateFormBtn">Проверить всю форму</button>
                <button class="outline" id="asyncValidateBtn">Асинхронная проверка email</button>
            </div>
            <div id="formResult" class="test-report" style="margin-top: 15px;">⏳ Результаты появятся здесь</div>
        </div>
        <div class="panel">
            <h2>🧪 Тестирование валидаторов</h2>
            <p><small>Нажмите на кнопки, чтобы запустить тесты с граничными случаями</small></p>
            <div class="button-row">
                <button data-test="email">📧 Email</button>
                <button data-test="phone">📞 Телефон</button>
                <button data-test="password">🔒 Пароль</button>
                <button data-test="url">🌐 URL</button>
                <button data-test="date">📅 Дата</button>
                <button data-test="file">📎 Файл</button>
                <button data-test="custom">⚙️ Кастомное правило</button>
                <button data-test="dependent">🔗 Зависимые поля</button>
            </div>
            <div id="testOutput" class="test-report">✅ Результаты тестов появятся здесь</div>

            <hr>
            <h3>🔧 Генератор регулярных выражений</h3>
            <div class="regex-generator">
                <div class="form-group">
                    <label>RegExp (без слэшей, флаги в отдельном поле)</label>
                    <input type="text" id="regexPattern" placeholder="^[a-z]+$" value="^[a-z]+$">
                </div>
                <div class="flex-row">
                    <div style="flex:1">
                        <label>Флаги</label>
                        <input type="text" id="regexFlags" placeholder="gi" value="i">
                    </div>
                    <div style="flex:1">
                        <label>Тестовая строка</label>
                        <input type="text" id="regexTestString" placeholder="hello" value="Hello">
                    </div>
                </div>
                <button class="primary" id="testRegexBtn">Протестировать</button>
                <div id="regexResult" style="margin-top: 12px; padding: 10px; background: white; border-radius: 12px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="./js/script.js"></script>
</body>
</html>
